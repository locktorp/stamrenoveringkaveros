<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbetsmoment per takt</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  font-family: Arial;
  background:#f4f6f8;
}

.container{
  padding:20px;
}

.table-wrapper{
  overflow:auto;
  background:white;
}

table{
  border-collapse:collapse;
  min-width:1400px;
}

th, td{
  border:1px solid #999;
  padding:6px;
  vertical-align:top;
  font-size:13px;
}

/* HEADER */
th{
  color:white;
  text-align:center;
  font-weight:bold;
}

/* FÄRGER */
.step-1{background:#a9d5b5;}
.step-2{background:#e6d3b3;}
.step-3{background:#c6d9f1;}
.step-4{background:#c6d9f1;}
.step-5{background:#6fa8dc;}
.step-6{background:#3d85c6;}
.step-7{background:#d9d9d9;}
.step-8{background:#eeeeee;}
.step-9{background:#f4b6a6;}
.step-10{background:#93c47d;}

/* DAG */
.day{
  font-weight:bold;
  background:#eee;
  width:80px;
  text-align:left;
}

/* MULTI ROW IN CELL */
.task{
  padding:3px 0;
  border-bottom:1px solid #eee;
}
.task:last-child{
  border-bottom:none;
}
</style>
</head>

<body>

<div id="header-container"></div>

<div class="container">
<h1>Arbetsmoment per takt</h1>

<div class="table-wrapper">
<table>

<thead>
<tr>
  <th></th>
  <th class="step-1">1<br>Rivning</th>
  <th class="step-2">2<br>VS-arbeten</th>
  <th class="step-3">3<br>Torktid</th>
  <th class="step-4">4<br>Torktid</th>
  <th class="step-5">5<br>Bygg 1</th>
  <th class="step-6">6<br>Bygg 2</th>
  <th class="step-7">7<br>Flytspackling</th>
  <th class="step-8">8<br>Kakel</th>
  <th class="step-9">9<br>Komplettering</th>
  <th class="step-10">10<br>Överlämning</th>
</tr>
</thead>

<tbody id="body"></tbody>

</table>
</div>
</div>

<script>

/* 🔥 DATA – EXAKT STRUKTUR SOM DIN EXCEL */
const data = [
{
  day: "Dag 1",
  rows: [
    [
      "RIV - Sanering\nVVS - Avstängning vatten",
      "BYGG - Formning\nVVS - Kassett",
      "BYGG - Isolering\nBYGG - Gips",
      "MÅL - Spackling",
      "BYGG - Rivning",
      "BYGG - Rivning",
      "MÅL - Spackling",
      "KAKEL - Tätskikt",
      "BYGG - Montering",
      ""
    ]
  ]
},
{
  day: "Dag 2",
  rows: [
    [
      "RIV - Sanering",
      "VVS - Avlopp",
      "BYGG - Isolering",
      "MÅL - Spackling",
      "BYGG - Rivning",
      "BYGG - Rivning",
      "MÅL - Spackling",
      "KAKEL - Tätskikt",
      "BYGG - Montering",
      ""
    ]
  ]
}
]

/* 🔥 BYGG TABELL */
const tbody = document.getElementById("body")

data.forEach(day => {

  day.rows.forEach((row, i) => {

    const tr = document.createElement("tr")

    if(i === 0){
      const tdDay = document.createElement("td")
      tdDay.className = "day"
      tdDay.rowSpan = day.rows.length
      tdDay.innerText = day.day
      tr.appendChild(tdDay)
    }

    row.forEach(cell => {
      const td = document.createElement("td")

      td.innerHTML = cell
        .split("\n")
        .map(item => `<div class="task">${item}</div>`)
        .join("")

      tr.appendChild(td)
    })

    tbody.appendChild(tr)
  })

})

</script>

<script>
fetch("header.html")
.then(res => res.text())
.then(data => {
  document.getElementById("header-container").innerHTML = data
})
</script>

</body>
</html>
