<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>KMA</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
}

/* container */
.kma-container{
padding:100px 20px 40px;
max-width:1000px;
margin:auto;
}

/* block */
.kma-block{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.kma-block h2{
margin-bottom:10px;
}

</style>

</head>

<body>

<div id="header-container"></div>

<div class="kma-container">

<div class="kma-block">
<h2>Arbetsmiljö</h2>
<p>Här kan du lägga information om arbetsmiljö.</p>
</div>

<div class="kma-block">
<h2>Kvalitet</h2>
<p>Här kan du lägga kvalitetsdokument.</p>
</div>

<div class="kma-block">
<h2>Miljö</h2>
<p>Här kan du lägga miljöinformation.</p>
</div>

</div>

<script>
fetch("./header.html")
.then(res => res.text())
.then(data => {
document.getElementById("header-container").innerHTML = data
})
</script>

</body>
</html>
