<!DOCTYPE html>
<html lang="sv">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<meta charset="UTF-8">
<title>Ritningar</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
}  

.container{
padding:100px 20px 40px;
max-width:1200px;
margin:auto;
}

.block{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.block h2{
margin-bottom:10px;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.buttons button{
padding:12px 16px;
border:none;
border-radius:6px;
background:#e6e6e6;
cursor:pointer;
font-weight:bold;
}

.buttons button:hover{
background:#d0d0d0;
}

.viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
z-index:2000;
display:flex;
justify-content:center;
align-items:center;
}

.viewer iframe{
width:90%;
height:90%;
border:none;
background:white;
border-radius:8px;
}

.hidden{
display:none;
}

.close-btn{
position:absolute;
top:20px;
right:30px;
font-size:30px;
background:none;
border:none;
color:white;
cursor:pointer;
}
 
</style>

</head>

<body>

<div id="header-container"></div>

<div class="container">

<!-- DIRIGENTGATAN 6 -->
<div class="block">
<h2>Dirigentgatan 6</h2>
<div class="buttons">
<button onclick="openPdf('04Källare Hus 6.pdf')">Källare</button>
<button onclick="openPdf('05Entréplan Hus 6.pdf')">Entréplan</button>
<button onclick="openPdf('06Vån 1-3 Hus 6.pdf')">Vån 1–3</button>
<button onclick="openPdf('013Uppställningsritning badrum.pdf')">Uppställning Badrum</button>
</div>
</div>

<!-- DIRIGENTGATAN 3 -->
<div class="block">
<h2>Dirigentgatan 3</h2>
<div class="buttons">
<button onclick="openPdf('07Källare Hus 3.pdf')">Källare</button>
<button onclick="openPdf('08Entréplan Hus 3.pdf')">Entréplan</button>
<button onclick="openPdf('09Vån 1-3 Hus 3.pdf')">Vån 1–3</button>
</div>
</div>

<!-- DIRIGENTGATAN 1 -->
<div class="block">
<h2>Dirigentgatan 1</h2>
<div class="buttons">
<button onclick="openPdf('010Källare Hus 1.pdf')">Källare</button>
<button onclick="openPdf('011Entréplan Hus 1.pdf')">Entréplan</button>
<button onclick="openPdf('012Vån 1-3 Hus 1.pdf')">Vån 1–3</button>
</div>
</div>

<!-- DIRIGENTGATAN 4 -->
<div class="block">
<h2>Dirigentgatan 4</h2>
<div class="buttons">
<button onclick="openPdf('01Källare Hus 4.pdf')">Källare</button>
<button onclick="openPdf('02Entréplan Hus 4.pdf')">Entréplan</button>
<button onclick="openPdf('03Vån 1-3 Hus 4.pdf')">Vån 1–3</button>
 </div>
  </div>

</div>

<div id="viewer" class="viewer" style="display:none;">
  <button class="close-btn" onclick="closeViewer()">✕</button>
  <iframe id="pdfFrame"></iframe>
</div>

<script>

function openPdf(file){
document.getElementById("pdfFrame").src = file
document.getElementById("viewer").style.display = "flex"
}

function closeViewer(){
document.getElementById("viewer").style.display = "none"
document.getElementById("pdfFrame").src = ""
}

fetch("./header.html")
.then(res => res.text())
.then(data => {
document.getElementById("header-container").innerHTML = data
})

</script>

<script>
fetch("header.html")
.then(res => res.text())
.then(data => {
  document.getElementById("header-container").innerHTML = data;
});

document.addEventListener("click", function(e) {
  if (e.target.closest(".menu-toggle")) {
    const menu = document.getElementById("navMenu");
    if (menu) {
      menu.classList.toggle("show");
    }
  }
});
</script>
 
</body>
</html>
