<!DOCTYPE html>
<html lang="sv">
<head>

<style>
body{
  margin:0;

}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  padding:10px 20px;
  background:white;
  box-shadow:0 3px 8px rgba(0,0,0,0.25);

  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
}

.logo{
  height:35px;
  margin-right:15px;
}

.title{
  font-weight:bold;
  margin-right:20px;
}

.nav{
  display:flex;
  gap:10px;
}

.nav button{
  padding:6px 12px;
  border:none;
  background:#e0e0e0;
  cursor:pointer;
  border-radius:6px;
}

/* 🔥 FULLSCREEN POSTER */
.poster{
  position:fixed;
  top:70px; /* höjd på header */
  left:0;
  width:100vw;
  height:calc(100vh - 70px);
}

.poster iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

  </div>

</div>

<!-- POSTER -->
