<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Stamplaner</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
background:#111;
}

.image-container{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding-top:80px; /* plats för header */
box-sizing:border-box;
}

.image-container img{
max-width:100%;
max-height:100%;
object-fit:contain;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
border-radius:8px;
}

</style>

</head>
<body>

<div id="header-container"></div>

<div class="image-container">
<img src="Stamplaner.jpg">
</div>

<script>
fetch("./header.html")
.then(res => res.text())
.then(data => {
document.getElementById("header-container").innerHTML = data
})
</script>

</body>
</html>
