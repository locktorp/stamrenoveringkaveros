<!DOCTYPE html>
<html>
<head>
  <title>Logga in</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      width: 300px;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4facfe;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #3a8dde;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Logga in</h2>
    <input type="password" id="password" placeholder="Lösenord">
    <button onclick="login()">Logga in</button>
  </div>

  <script>
    function login() {
      const pwd = document.getElementById("password").value;

      if (pwd === "kaveros123") {
        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("expires", new Date().getTime() + 86400000);
        window.location.href = "index.html";
      } else {
        alert("Fel lösenord");
      }
    }
  </script>

</body>
</html>
