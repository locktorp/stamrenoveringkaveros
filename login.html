<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Välkommen Stamrenovering Kaverös</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      /* DIN BAKGRUND */
      background: url("bakgrund.jpg") no-repeat center center;
      background-size: cover;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.95);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      width: 90%;
      max-width: 320px;
      text-align: center;
    }

    h2 {
      margin-bottom: 5px;
      font-size: 20px;
    }

    p {
      margin-top: 0;
      margin-bottom: 20px;
      color: #666;
      font-size: 14px;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #0072ce;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:active {
      background: #005fa3;
    }

    .error {
      color: red;
      font-size: 14px;
      display: none;
      margin-bottom: 10px;
    }

    .checkbox {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }

  </style>
</head>

<body>

  <div class="login-box">
    <h2>Välkommen</h2>
    <p>Stamrenovering Kaverös</p>

    <input type="password" id="password" placeholder="Lösenord">

    <div class="checkbox">
      <input type="checkbox" id="show" onclick="togglePassword()">
      <label for="show">Visa lösenord</label>
    </div>

    <p id="error" class="error">Fel lösenord</p>

    <button onclick="login()">Logga in</button>
  </div>

  <script>
    if (localStorage.getItem("loggedIn") === "true") {
      window.location.href = "index.html";
    }

    function login() {
      const pwd = document.getElementById("password").value;

      if (pwd === "kaveros") {
        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("expires", new Date().getTime() + 86400000);
        window.location.href = "index.html";
      } else {
        document.getElementById("error").style.display = "block";
      }
    }

    function togglePassword() {
      const input = document.getElementById("password");
      input.type = input.type === "password" ? "text" : "password";
    }

    document.getElementById("password").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        login();
      }
    });
  </script>

</body>
</html>
