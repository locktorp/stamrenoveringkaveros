<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<link rel="stylesheet" href="style.css">
    
<meta charset="UTF-8">
<title>Klickbar infotavla</title>

<style>
.infotavla {
    background: #0f3c82;
    min-height: 100vh;
}

.container {
    position: relative;
    width: 100%;
    max-width: 2048px;
    margin: auto;
}

.container img {
    width: 100%;
    display: block;
}

/* Klickytor */
.area {
    position: absolute;
    display: block;
}

/* Debug (ta bort sen) */
.area:hover {
    background: rgba(255, 0, 0, 0.2);
}
</style>
</head>

<body>

<div id="header-container"></div>

<div class="infotavla">

        <!-- dina klickytor -->

<script>
fetch("header.html")

<script>
fetch("header.html")
.then(res => res.text())
.then(data => {
  document.getElementById("header-container").innerHTML = data;
});

document.addEventListener("click", function(e) {
  if (e.target.closest(".menu-toggle")) {
    const menu = document.getElementById("navMenu");
    if (menu) {
      menu.classList.toggle("show");
    }
  }
});
</script>
