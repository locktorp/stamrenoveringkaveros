<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Arbetsplatsinformation</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b3d91;
color:white;
}

h1{
padding:20px;
margin:0;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
color:black;
padding:10px;
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
border-radius:5px;
}

.viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:none;
flex-direction:column;
}

.viewer iframe{
flex:1;
width:100%;
border:none;
}

.closeBtn{
background:red;
color:white;
padding:15px;
cursor:pointer;
text-align:center;
}
</style>
</head>

<body>

<h1>Arbetsplatsinformation</h1>

<div class="grid">

<!-- 1 -->
<div class="card" onclick="openPDF('arbetsmiljoanslag.pdf')">
<img src="arbetsmiljoanslag.jpg">
<p>Arbetsmiljöanslag</p>
</div>

<!-- 2 -->
<div class="card" onclick="openPDF('nodsituation.pdf')">
<img src="nodsituation.jpg">
<p>Anslag nödsituation</p>
</div>

<!-- 3 -->
<div class="card" onclick="openPDF('larmkedja.pdf')">
<img src="larmkedja.jpg">
<p>Larmkedja</p>
</div>

<!-- 4 -->
<div class="card" onclick="openPDF('checklista-olycka.pdf')">
<img src="olycka.jpg">
<p>Checklista arbetsplatsolycka</p>
</div>

<!-- 5 -->
<div class="card" onclick="openPDF('checklista-miljo.pdf')">
<img src="miljo.jpg">
<p>Checklista miljöolycka/tillbud</p>
</div>

<!-- 6 -->
<div class="card" onclick="openPDF('forhandsanmalan.pdf')">
<img src="forhandsanmalan.jpg">
<p>Förhandsanmälan</p>
</div>

<!-- 7 -->
<div class="card" onclick="openPDF('arbetsmiljoplan.pdf')">
<img src="arbetsmiljoplan.jpg">
<p>Arbetsmiljöplan</p>
</div>

<!-- 8 -->
<div class="card" onclick="openPDF('ordningsregler.pdf')">
<img src="ordning.jpg">
<p>Ordnings- och skyddsregler</p>
</div>

<!-- 9 -->
<div class="card" onclick="openPDF('protokoll.pdf')">
<img src="protokoll.jpg">
<p>Protokoll skydds- och miljörond</p>
</div>

<!-- 10 -->
<div class="card" onclick="openPDF('etiska.pdf')">
<img src="etiska.jpg">
<p>Rapportering etiska övertramp</p>
</div>

<!-- 11 -->
<div class="card" onclick="openPDF('miljoinventering.pdf')">
<img src="miljo2.jpg">
<p>Beställarens miljöinventering</p>
</div>

</div>

<!-- VIEWER -->
<div class="viewer" id="viewer">
<div class="closeBtn" onclick="closePDF()">Stäng</div>
<iframe id="pdfFrame"></iframe>
</div>

<script>
function openPDF(file){
document.getElementById("viewer").style.display="flex";
document.getElementById("pdfFrame").src=file;
}

function closePDF(){
document.getElementById("viewer").style.display="none";
document.getElementById("pdfFrame").src="";
}
</script>

</body>
</html>
