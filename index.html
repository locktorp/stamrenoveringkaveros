<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stamrenovering Kaverös</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header style="display:flex;align-items:center;justify-content:space-between;">
<div>
<img src="skanska-logo.png" style="height:40px;margin-right:10px;vertical-align:middle;">
Stamrenovering Kaverös
</div>
<div style="font-size:14px;">
Användare:
<input id="usernameInput" placeholder="namn" style="padding:4px;">
<button onclick="saveUser()">Spara</button>
<span id="currentUser" style="margin-left:8px;font-weight:bold;"></span>
</div>
</header>

<div class="container">
<h2>Stamplan</h2>
<div id="house"></div>

<div class="dashboard">
<h2>Projektstatus</h2>
<div class="stats">
<div class="stat" id="total"></div>
<div class="stat" id="done"></div>
<div class="stat" id="progress"></div>
<div class="stat" id="notStarted"></div>
</div>

<h3>Tillval sammanställning</h3>
<div id="tillvalSummary"></div>

<h3>Försenade aktiviteter</h3>
<div id="delays" class="delayList"></div>
</div>
</div>

<div id="modal" class="modal">
<div class="modal-content" id="apartmentContent"></div>
</div>

<script src="app.js"></script>
<script type="module"> import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js"; import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js"; const firebaseConfig = { apiKey: "AIzaSyDZY6BJsd1MkzHIY6gUkwFFXz43ACv1NAk", authDomain: "stamrenovering-kaveros.firebaseapp.com", projectId: "stamrenovering-kaveros", storageBucket: "stamrenovering-kaveros.firebasestorage.app", messagingSenderId: "974224372973", appId: "1:974224372973:web:009e07621ecf4cbe5f88e4" }; const app = initializeApp(firebaseConfig); const db = getFirestore(app); function firebaseSave(data){ setDoc(doc(db,"project","kaveros"),{data:data}) } onSnapshot(doc(db,"project","kaveros"),(snap)=>{ if(snap.exists()){ let remote = snap.data().data localStorage.setItem("kaveros_data",JSON.stringify(remote)) renderHouse() } }) const oldSetItem = localStorage.setItem localStorage.setItem = function(key,value){ oldSetItem.apply(this,arguments) if(key==="kaveros_data"){ try{ firebaseSave(JSON.parse(value)) }catch(e){} } } </script>
</body>
</html>
