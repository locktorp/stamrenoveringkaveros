<label>

Köksförnyelse
</label>

<br>

<label>
<input type="checkbox"
id="towel"
onchange="saveOptions(aptTitle.innerText.split(' ')[1])">
Handdukstork
</label>

</div>

<div>

<label>
<input type="checkbox"
id="tom"
onchange="saveOptions(aptTitle.innerText.split(' ')[1])">

</label>

<br>

<label>
<input type="checkbox"
id="evak"
onchange="saveOptions(aptTitle.innerText.split(' ')[1])">
Evakuerad
</label>

</div>

</div>

<h4>Anteckningar</h4>

id="note"
onchange="saveOptions(aptTitle.innerText.split(' ')[1])">

<div id="activities"></div>
